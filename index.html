<style>
:root{--bg:#031312;--panel:#071f1d;--panel2:#092a27;--gold:#f4c84d;--gold2:#ffe79a;--teal:#00b99e;--line:#92732c;--muted:#a8b8b3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#12413b 0,#031312 55%);color:#f8f5e9;font-family:Inter,Arial,sans-serif;padding-bottom:92px}
button{font:inherit;cursor:pointer}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-bottom:1px solid #7d682f;background:#031715eF;position:sticky;top:0;z-index:5}
.menuBtn{border:0;background:none;color:var(--gold);font-size:31px;line-height:1;padding:4px 8px}.brand{display:flex;align-items:center;gap:7px;color:var(--gold);font-weight:950;font-size:clamp(25px,6vw,39px);letter-spacing:1px;text-shadow:0 2px 12px #bd8b18}.crown{font-size:27px}.profile{border:1px solid #9c8545;border-radius:28px;padding:8px 10px;display:flex;align-items:center;gap:8px;background:#071b1a;max-width:145px;font-size:11px}.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#f9d96e,#946a17);display:grid;place-items:center;color:#13211d;font-size:19px}.profile b{display:block;font-size:12px;white-space:nowrap}.profile small{color:#c8c8b8}
.wallet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;padding:13px 14px;align-items:center}.balance{grid-column:span 1;border:1px solid #8d7944;border-radius:18px;padding:13px 9px;background:linear-gradient(120deg,#071c1a,#020d0d);text-align:center;color:var(--gold2);font-size:clamp(15px,4vw,22px);font-weight:800;white-space:nowrap}.balance small{display:block;color:#b4c0b8;font-size:10px;font-weight:500;margin-bottom:4px}.action{border-radius:30px;border:1px solid #f8d15c;padding:14px 4px;font-weight:800;font-size:clamp(12px,3vw,16px);color:#2d2105;background:linear-gradient(#ffe27a,#d99a13);box-shadow:0 4px 12px #0008}.action.withdraw{border-color:#28d6bd;color:#eafffb;background:linear-gradient(#00b99e,#006b61)}
.banner{margin:7px 14px 0;min-height:176px;border:1px solid var(--gold);border-radius:20px;overflow:hidden;position:relative;background:radial-gradient(circle at 80% 45%,#176c5e 0,#082a27 36%,#031412 75%);box-shadow:0 0 20px #008b7830}.banner:before{content:"♛";position:absolute;left:10px;bottom:-25px;font-size:135px;color:#dba92d;opacity:.28}.banner:after{content:"✦  ✧  ✦";position:absolute;right:12px;top:20px;color:#f6d66b;font-size:22px;letter-spacing:12px;opacity:.7}.bannerText{position:relative;z-index:1;padding:28px 20px;max-width:70%}.bannerText small{color:#f5d77b;letter-spacing:3px;font-weight:800}.bannerText h1{font-size:clamp(30px,8vw,52px);margin:8px 0;color:var(--gold2);line-height:1;text-shadow:0 3px 12px #000}.bannerText p{margin:10px 0 0;color:#d5e5df;font-weight:700;letter-spacing:1px}.bannerArt{position:absolute;right:12px;bottom:12px;font-size:clamp(65px,18vw,112px);filter:drop-shadow(0 7px 10px #0008)}
.dots{display:flex;justify-content:center;gap:8px;padding:11px}.dots i{width:8px;height:8px;border-radius:50%;background:#52635e}.dots i:first-child{background:var(--gold)}
.shortcuts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:6px 13px 16px}.shortcut{min-width:0;border:1px solid #a58b4a;border-radius:15px;background:linear-gradient(145deg,#0c3731,#031715);padding:12px 3px 10px;text-align:center;box-shadow:inset 0 0 16px #00a68b14}.shortcut .ico{display:block;font-size:27px;color:var(--gold);margin-bottom:6px}.shortcut span:last-child{font-size:clamp(9px,2.7vw,12px);font-weight:700;white-space:nowrap}
.section{margin:5px 14px 12px;border:1px solid var(--gold);border-radius:16px;padding:13px 15px;background:linear-gradient(100deg,#0b302b,#061816);display:flex;justify-content:space-between;align-items:center;color:var(--gold);font-weight:850;font-size:19px}.section button{background:none;border:0;color:var(--gold);font-size:13px;font-weight:700}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 14px}.game{height:130px;border:1px solid #c89b36;border-radius:17px;position:relative;overflow:hidden;display:flex;align-items:end;padding:12px;background:linear-gradient(145deg,#123c70,#071b35 55%,#080f19);box-shadow:0 5px 13px #0008}.game:nth-child(2){background:linear-gradient(145deg,#57361b,#151b22 65%,#0b1217)}.game:nth-child(3){background:linear-gradient(145deg,#123c69,#09162c 65%,#0b111d)}.game:nth-child(4){background:linear-gradient(145deg,#33475b,#101a2a 65%,#080f18)}.game .art{position:absolute;right:8px;top:3px;font-size:66px;filter:drop-shadow(0 5px 6px #0009)}.game b{position:relative;color:#ffe28a;font-size:20px;font-style:italic;text-shadow:0 2px 5px #000;letter-spacing:1px}.bottom{position:fixed;z-index:6;bottom:0;left:0;right:0;height:76px;padding:7px 5px max(7px,env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;background:#031715f5;border-top:1px solid #9a7c37;box-shadow:0 -8px 25px #0008}.nav{border:0;background:none;color:#d7d6c6;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;min-width:54px}.nav .ni{font-size:23px;color:var(--gold)}.nav.member{border:1px solid var(--gold);border-radius:50%;width:67px;height:67px;background:radial-gradient(#17463d,#031412);margin-top:-23px;justify-content:center;color:var(--gold2);box-shadow:0 0 12px #000}.nav.member .ni{font-size:25px}
.drawerShade{position:fixed;inset:0;background:#0009;z-index:9;display:none}.drawer{position:fixed;z-index:10;top:0;bottom:0;left:0;width:min(310px,84vw);background:linear-gradient(160deg,#0b302b,#031211);border-right:1px solid var(--gold);padding:20px 15px;transform:translateX(-105%);transition:.25s;overflow:auto}.drawer.open{transform:translateX(0)}.drawerShade.open{display:block}.drawerHead{display:flex;justify-content:space-between;align-items:center;color:var(--gold);font-size:24px;font-weight:900;margin-bottom:20px}.close{background:none;border:0;color:white;font-size:27px}.drawerGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.drawerGrid button{min-height:75px;border:1px solid #826d39;border-radius:12px;background:#08211e;color:#f6e8b9;font-weight:700}.drawerGrid span{display:block;font-size:23px;margin-bottom:5px;color:var(--gold)}
.notice{text-align:center;color:#9fb1a9;font-size:10px;padding:14px}
@media(min-width:650px){body{max-width:520px;margin:auto;border-left:1px solid #25443d;border-right:1px solid #25443d;min-height:100vh}.top{position:relative}.games{grid-template-columns:repeat(4,1fr)}.game{height:145px}}
</style>
