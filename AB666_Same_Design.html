<html lang="en">
<head>

<title>AB666</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#00120f;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding-bottom:84px;background:radial-gradient(ellipse at 50% 24%,#073b32 0,#001b17 54%,#000e0c 100%)}
button{font:inherit;cursor:pointer}
.top{height:78px;padding:0 13px;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;background:#001713;border-bottom:1px solid #a17b24}
.menu{background:none;border:0;color:#f7c845;font-size:31px;padding:0}
.brand{display:flex;justify-content:center;align-items:center;gap:8px;color:#f6c94d;font-weight:900;font-size:clamp(26px,7vw,40px);text-shadow:0 0 14px #d5a52d;white-space:nowrap}
.brand span:first-child{font-size:30px}
.user{display:flex;align-items:center;gap:7px;border:1px solid #9d7b34;border-radius:34px;padding:7px 9px;background:#031c18;min-width:0}
.avatar{height:35px;width:35px;border-radius:50%;background:linear-gradient(140deg,#ffe08a,#a57518);display:grid;place-items:center;color:#17221a;font-size:20px;flex-shrink:0}
.user b{display:block;font-size:11px;white-space:nowrap}.user small{font-size:10px;color:#c4c9bd;white-space:nowrap}
.wallet{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:9px;padding:13px 14px 12px;align-items:center}
.balance{height:69px;border:1px solid #9a7937;border-radius:22px;background:linear-gradient(130deg,#051c18,#00100e);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#ffe28c}
.balance small{font-size:10px;color:#bac5bd;margin-bottom:5px}.balance strong{font-size:clamp(17px,4.6vw,23px)}
.action{height:56px;border:1px solid #ffdc6b;border-radius:32px;background:linear-gradient(#ffe17a,#dca019);color:#2a2108;font-weight:800;font-size:clamp(12px,3.4vw,16px);box-shadow:0 3px 10px #0007}
.action.out{background:linear-gradient(#00c8a9,#007568);border-color:#24d7c0;color:white}
.banner{display:block;width:calc(100% - 20px);height:auto;aspect-ratio:3.72/1;object-fit:cover;margin:3px 10px 0;border:1px solid #e7bb42;border-radius:17px;box-shadow:0 0 15px #d9a82b22}
.dots{height:29px;display:flex;justify-content:center;align-items:center;gap:9px}.dots i{width:9px;height:9px;border-radius:50%;background:#52615d}.dots i:first-child{background:#f4c43d}
.categories{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding:0 11px 14px}
.categories button{border:0;background:none;padding:0;min-width:0}
.categories img{width:100%;height:auto;display:block;aspect-ratio:1.27/1;object-fit:fill;border-radius:13px}
.section{height:58px;margin:0 11px 13px;border:1px solid #d6aa39;border-radius:17px;background:linear-gradient(90deg,#06332d,#041c18);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#f5c746;box-shadow:0 3px 10px #0005}
.section strong{font-size:clamp(16px,4.5vw,23px)}.section button{border:0;background:none;color:#f6c84b;font-weight:800;font-size:12px;white-space:nowrap}
.games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;padding:0 13px}
.games button{border:0;background:none;padding:0;min-width:0}.games img{width:100%;display:block;aspect-ratio:1.23/1;object-fit:fill;border-radius:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:77px;z-index:4;background:#001713f5;border-top:1px solid #94752e;display:flex;align-items:center;justify-content:space-around;padding:5px 5px max(5px,env(safe-area-inset-bottom));box-shadow:0 -5px 18px #0008}
.nav{border:0;background:none;color:#e6e5d9;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;min-width:53px}.nav i{font-style:normal;color:#f3c64c;font-size:23px;line-height:1}
.nav.member{width:65px;height:65px;border:1px solid #f0c343;border-radius:50%;background:radial-gradient(#0b3c32,#001612);margin-top:-23px;justify-content:center;color:#ffe18b;box-shadow:0 0 12px #000}
.nav.member i{font-size:24px}
.shade{display:none;position:fixed;inset:0;background:#000a;z-index:8}.shade.open{display:block}
.drawer{position:fixed;z-index:9;left:0;top:0;bottom:0;width:min(310px,84vw);padding:18px 14px;background:linear-gradient(150deg,#0a352d,#00130f);border-right:1px solid #d4aa3b;transform:translateX(-105%);transition:.22s;overflow:auto}.drawer.open{transform:translateX(0)}
.drawerHead{display:flex;justify-content:space-between;align-items:center;color:#f3c64c;font-size:22px;font-weight:900;margin-bottom:16px}.drawerHead button{border:0;background:none;color:#fff;font-size:27px}
.drawerGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.drawerGrid button{height:72px;border:1px solid #8f7439;border-radius:12px;background:#06251f;color:#f4e9c7;font-weight:700;font-size:12px}.drawerGrid span{display:block;color:#f0c54d;font-size:21px;margin-bottom:4px}
.toast{position:fixed;z-index:12;left:50%;bottom:92px;transform:translateX(-50%);background:#092a24;border:1px solid #c39a36;color:#fff0c0;padding:10px 15px;border-radius:12px;font-size:12px;display:none;white-space:nowrap}
@media(max-width:360px){.top{padding:0 9px;grid-template-columns:32px 1fr auto}.user{padding:5px 6px}.avatar{width:30px;height:30px}.user b{font-size:10px}.wallet{gap:6px;padding-left:9px;padding-right:9px}.action{font-size:11px}.categories{gap:4px;padding-left:7px;padding-right:7px}}
@media(min-width:600px){body{max-width:480px;margin:auto;border-left:1px solid #29463e;border-right:1px solid #29463e}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(480px,100%)}}
</style>
